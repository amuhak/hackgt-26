[platformio]
default_envs = buoy

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = no_ota.csv
board_build.filesystem = littlefs

; Buoy with real sensors
[env:buoy]
build_src_filter = +<common/> +<buoy/>
lib_deps =
  adafruit/Adafruit BMP280 Library@^2.6.8
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  mikalhart/TinyGPSPlus@^1.1.0

; Buoy with real sensors that logs everything: raw GPS NMEA, sensor values
; every second, each radio frame with RSSI, mesh/store decisions
[env:buoy_debug]
extends = env:buoy
build_flags = -DDEBUG_LOG
monitor_filters = esp32_exception_decoder, time

; Buoy with fake readings, for testing the mesh on bare ESP32s
[env:buoy_sim]
extends = env:buoy
build_flags = -DSIM_SENSORS

; Mesh simulation on one ESP32: virtual buoys + collector over a lossy fake radio
[env:meshsim]
build_src_filter = +<common/mesh.cpp> +<buoy/store.cpp> +<sim/>

; ESP32 plugged into the laptop; run tools/collector.py against it
[env:collector]
build_src_filter = +<common/> +<collector/>
monitor_speed = 921600
